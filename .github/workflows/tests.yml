# 시험을 리눅스·Python 3.12 에서 자동으로 - 실기(RHEL 8.1, Python 3.12)에 가까운 조건.
#
# 개발 PC 는 Windows·3.10 이라 리눅스에서만 도는 코드(/proc 부하 측정, 파일 권한,
# 하드링크, st_blocks, `du` 비교)는 그 시험을 건너뛰거나 빈 값으로만 확인했다.
# main 에 푸시할 때마다 GitHub 의 리눅스 머신 한 대가 전체 시험을 돌린다.
#
# 폐쇄망 실기와는 무관하다 - 반입 ZIP 에 이 파일이 들어가도 아무 일도 하지 않는다.
# 실패해도 그달 무료 시간을 넘겨도 요금이 저절로 붙지는 않는다 (그달은 멈출 뿐).
name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyQt5 가 오프스크린으로 뜨는 데 필요한 공유 라이브러리.
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-noto-cjk

      - name: Python packages
        run: python -m pip install --upgrade pip && python -m pip install PyQt5 pytest pyflakes

      - name: pyflakes
        run: python -m pyflakes smvwp tests *.py

      # 언어·테마가 전역 상태라 순서에 기대는 시험을 잡으려고 두 순서로 돈다.
      - name: Tests (forward)
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Tests (reverse)
        run: python -m pytest $(ls tests/test_*.py | sort -r) -q -p no:cacheprovider
